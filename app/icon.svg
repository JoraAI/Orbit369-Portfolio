<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A05C"/>
      <stop offset="50%" stop-color="#E8C077"/>
      <stop offset="100%" stop-color="#B0884A"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB25C"/>
      <stop offset="40%" stop-color="#FF7A33"/>
      <stop offset="100%" stop-color="rgba(255,122,51,0)"/>
    </radialGradient>
  </defs>
  <!-- Central ember glow (enlarged to fill center) -->
  <circle cx="32" cy="32" r="20" fill="url(#core)" opacity="0.95"/>
  <circle cx="32" cy="32" r="8" fill="#FFB25C" opacity="1"/>
  <!-- Orbit ring 1 (largest — more circular to fill vertically) -->
  <g transform="rotate(-18 32 32)">
    <ellipse cx="32" cy="32" rx="30" ry="22" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.85"/>
    <circle cx="62" cy="32" r="2.8" fill="#E8C077" opacity="1"/>
  </g>
  <!-- Orbit ring 2 (medium) -->
  <g transform="rotate(12 32 32)">
    <ellipse cx="32" cy="32" rx="25" ry="18" fill="none" stroke="url(#gold)" stroke-width="1.7" opacity="0.7"/>
    <circle cx="57" cy="32" r="2.2" fill="#E8C077" opacity="0.9"/>
  </g>
  <!-- Orbit ring 3 (smaller, closer) -->
  <g transform="rotate(-32 32 32)">
    <ellipse cx="32" cy="32" rx="18" ry="13" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="50" cy="32" r="1.6" fill="#E8C077" opacity="0.85"/>
  </g>
</svg>